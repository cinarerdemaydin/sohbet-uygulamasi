<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sohbet & Ses Alanı</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0d0d0d; color: #e6e6e6; height: 100vh; display: flex; align-items: center; justify-content: center; }

        /* Giriş Ekranı */
        #login-screen { background: #141414; border: 1px solid #262626; padding: 30px; border-radius: 12px; width: 100%; max-width: 380px; text-align: center; }
        #login-screen h2 { font-size: 20px; margin-bottom: 20px; color: #fff; }
        .input-group { margin-bottom: 14px; text-align: left; }
        .input-group label { display: block; font-size: 11px; text-transform: uppercase; color: #888; margin-bottom: 6px; }
        .custom-input, .custom-select { width: 100%; padding: 12px; background: #0a0a0a; border: 1px solid #282828; border-radius: 6px; color: #fff; outline: none; }
        .btn-primary { width: 100%; padding: 12px; background: #fff; color: #000; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 10px; }

        /* Ana Sohbet Ekranı */
        #chat-container { display: none; width: 100%; height: 100vh; }
        .sidebar { width: 260px; background: #111; border-right: 1px solid #222; padding: 24px 16px; display: flex; flex-direction: column; }
        .room-tag { font-size: 12px; color: #666; text-transform: uppercase; margin-bottom: 12px; }
        .room-title { font-size: 16px; font-weight: 600; color: #fff; padding: 10px; background: #1a1a1a; border-radius: 6px; border-left: 3px solid #fff; margin-bottom: 20px; }
        
        /* Ses Kontrol Alanı */
        .voice-box { background: #161616; border: 1px solid #262626; padding: 12px; border-radius: 8px; margin-bottom: 20px; }
        .voice-btn { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-bottom: 8px; transition: 0.2s; }
        .btn-connect { background: #10b981; color: #000; }
        .btn-disconnect { background: #ef4444; color: #fff; display: none; }
        .btn-mute { background: #333; color: #fff; display: none; }

        /* Discord Tarzı Ses Bilgi Durumu */
        .voice-status { display: none; align-items: center; justify-content: space-between; background: #0f1f17; border: 1px solid #10b981; padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; font-size: 12px; color: #10b981; }
        .voice-status-left { display: flex; align-items: center; gap: 6px; font-weight: 600; }
        .voice-dot { width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; animation: pulse 1.5s infinite; }
        .voice-timer { font-family: monospace; font-size: 13px; font-weight: bold; color: #a7f3d0; }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        .online-list { flex: 1; overflow-y: auto; }
        
        /* Kullanıcı Listesi Öğe Stili ve Konuşma Işığı */
        .user-item { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; padding: 8px; border-radius: 6px; transition: all 0.2s ease; }
        .status-dot { width: 8px; height: 8px; background-color: #444; border-radius: 50%; transition: all 0.2s ease; }
        
        /* Discord Tarzı Konuşma Efekti (Işık Yanması) */
        .user-item.speaking {
            background: rgba(16, 185, 129, 0.15);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }
        .user-item.speaking .status-dot {
            background-color: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        .chat-main { flex: 1; display: flex; flex-direction: column; background: #0d0d0d; }
        .messages-area { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .msg { max-width: 65%; background: #161616; border: 1px solid #222; padding: 12px 16px; border-radius: 8px; align-self: flex-start; }
        .msg.me { align-self: flex-end; background: #222; border-color: #333; }
        .msg-meta { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 4px; font-size: 11px; }
        .msg-user { font-weight: 600; }
        .msg-time { color: #555; }
        .msg-text { font-size: 14px; color: #dddddd; }

        .input-bar { padding: 16px 24px; border-top: 1px solid #1f1f1f; background: #0d0d0d; }
        .input-wrapper { display: flex; gap: 12px; background: #141414; border: 1px solid #262626; padding: 6px 6px 6px 16px; border-radius: 8px; }
        .chat-input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 14px; }
        .send-btn { background: #fff; color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .error-msg { color: #ef4444; font-size: 12px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="login-screen">
        <h2>ÖZEL SOHBET ODASI</h2>
        <div class="input-group">
            <label>Kullanıcı Adı</label>
            <input type="text" id="username-input" class="custom-input" placeholder="İsminiz..." autocomplete="off">
        </div>
        <div class="input-group">
            <label>İsim Rengi</label>
            <select id="color-input" class="custom-select">
                <option value="#3b82f6">Mavi</option>
                <option value="#10b981">Yeşil</option>
                <option value="#ef4444">Kırmızı</option>
                <option value="#ec4899">Pembe</option>
                <option value="#a855f7">Eflatun / Mor</option>
                <option value="#f97316">Turuncu</option>
                <option value="#eab308">Sarı</option>
                <option value="#06b6d4">Çyan / Turkuaz</option>
            </select>
        </div>
        <div class="input-group">
            <label>Oda Şifresi</label>
            <input type="password" id="password-input" class="custom-input" placeholder="Oda şifresi..." autocomplete="off">
        </div>
        <button id="join-btn" class="btn-primary">Giriş Yap</button>
        <div id="error-box" class="error-msg">Hatalı Şifre!</div>
    </div>

    <!-- SOHBET VE SES EKRANI -->
    <div id="chat-container">
        <div class="sidebar">
            <div class="room-tag">Aktif Oda</div>
            <div class="room-title"># Özel Kanal</div>
            
            <div class="room-tag">Sesli Kanal</div>
            <div class="voice-box">
                <div id="voice-status" class="voice-status">
                    <div class="voice-status-left">
                        <div class="voice-dot"></div>
                        <span>Ses Bağlandı</span>
                    </div>
                    <div id="voice-timer" class="voice-timer">00:00</div>
                </div>

                <button id="join-voice-btn" class="voice-btn btn-connect">Sese Katıl</button>
                <button id="mute-voice-btn" class="voice-btn btn-mute">Sustur</button>
                <button id="leave-voice-btn" class="voice-btn btn-disconnect">Ayrıl</button>
            </div>

            <div class="room-tag">Çevrim İçi</div>
            <div class="online-list" id="user-list"></div>
        </div>

        <div class="chat-main">
            <div class="messages-area" id="messages"></div>
            <div class="input-bar">
                <form id="chat-form" class="input-wrapper">
                    <input type="text" id="msg-input" class="chat-input" placeholder="Bir şeyler yaz..." autocomplete="off" required>
                    <button type="submit" class="send-btn">Gönder</button>
                </form>
            </div>
        </div>
    </div>

    <div id="audio-container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const loginScreen = document.getElementById('login-screen');
        const chatContainer = document.getElementById('chat-container');
        const usernameInput = document.getElementById('username-input');
        const colorInput = document.getElementById('color-input');
        const passwordInput = document.getElementById('password-input');
        const joinBtn = document.getElementById('join-btn');
        const errorBox = document.getElementById('error-box');

        const form = document.getElementById('chat-form');
        const input = document.getElementById('msg-input');
        const messagesDiv = document.getElementById('messages');
        const userListDiv = document.getElementById('user-list');

        const joinVoiceBtn = document.getElementById('join-voice-btn');
        const leaveVoiceBtn = document.getElementById('leave-voice-btn');
        const muteVoiceBtn = document.getElementById('mute-voice-btn');
        const voiceStatus = document.getElementById('voice-status');
        const voiceTimer = document.getElementById('voice-timer');
        const audioContainer = document.getElementById('audio-container');

        let currentUser = "";
        let selectedColor = "#3b82f6";
        let localStream = null;
        let peers = {};
        let isMuted = false;
        let timerInterval = null;
        let secondsConnected = 0;
        let audioContext = null;
        let analyser = null;
        let microphone = null;
        let speakingInterval = null;

        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        joinBtn.addEventListener('click', () => {
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            selectedColor = colorInput.value;

            if (username && password) {
                currentUser = username;
                socket.emit('joinRoom', { username, password, color: selectedColor });
            }
        });

        socket.on('loginSuccess', () => {
            loginScreen.style.display = 'none';
            chatContainer.style.display = 'flex';
        });

        socket.on('loginError', (msg) => {
            errorBox.innerText = msg;
            errorBox.style.display = 'block';
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value.trim()) {
                socket.emit('chatMessage', { text: input.value });
                input.value = '';
            }
        });

        socket.on('message', (data) => {
            const isMe = data.user === currentUser;
            const msg = document.createElement('div');
            msg.classList.add('msg');
            if (isMe) msg.classList.add('me');
            msg.innerHTML = `
                <div class="msg-meta"><span class="msg-user" style="color:${data.color}">${data.user}</span><span class="msg-time">${data.time}</span></div>
                <div class="msg-text">${data.text}</div>
            `;
            messagesDiv.appendChild(msg);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });

        socket.on('updateUserList', (users) => {
            userListDiv.innerHTML = '';
            users.forEach(u => {
                const item = document.createElement('div');
                item.classList.add('user-item');
                item.id = `user-item-${u.username}`;
                item.innerHTML = `<div class="status-dot"></div><span style="color:${u.color}">${u.username}</span>`;
                userListDiv.appendChild(item);
            });
        });

        // SAYAÇ FONKSİYONLARI
        function startTimer() {
            secondsConnected = 0;
            voiceTimer.innerText = "00:00";
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsConnected++;
                const mins = Math.floor(secondsConnected / 60).toString().padStart(2, '0');
                const secs = (secondsConnected % 60).toString().padStart(2, '0');
                voiceTimer.innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            secondsConnected = 0;
            voiceTimer.innerText = "00:00";
        }

        // KONUŞMA TESPİTİ (DISCORD IŞIK EFEKTİ)
        function setupAudioAnalysis(stream) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            microphone = audioContext.createMediaStreamSource(stream);
            microphone.connect(analyser);
            analyser.fftSize = 512;

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            let wasSpeaking = false;

            speakingInterval = setInterval(() => {
                if (isMuted) {
                    if (wasSpeaking) {
                        wasSpeaking = false;
                        socket.emit('speakingStatus', false);
                    }
                    return;
                }

                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < bufferLength; i++) {
                    sum += dataArray[i];
                }
                let average = sum / bufferLength;

                // Hassasiyet eşiği (Ses seviyesi 15'ten büyükse konuşuyor kabul edilir)
                let isSpeaking = average > 15;

                if (isSpeaking !== wasSpeaking) {
                    wasSpeaking = isSpeaking;
                    socket.emit('speakingStatus', isSpeaking);
                }
            }, 100);
        }

        socket.on('userSpeaking', (data) => {
            // Socket ID'den ilgili kullanıcının elementini bulup ışığını yak/söndür
            const userList = document.querySelectorAll('.user-item');
            userList.forEach(item => {
                if (item.id === `user-item-${currentUser}` && data.id === socket.id) {
                    if (data.isSpeaking) item.classList.add('speaking');
                    else item.classList.remove('speaking');
                }
            });
        });

        // SESLİ SOHBET
        joinVoiceBtn.addEventListener('click', async () => {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        sampleRate: 48000,
                        sampleSize: 16,
                        channelCount: 1,
                        googEchoCancellation: true,
                        googAutoGainControl: true,
                        googNoiseSuppression: true,
                        googHighpassFilter: true
                    }, 
                    video: false 
                });

                joinVoiceBtn.style.display = 'none';
                leaveVoiceBtn.style.display = 'block';
                muteVoiceBtn.style.display = 'block';
                voiceStatus.style.display = 'flex';

                startTimer();
                setupAudioAnalysis(localStream);
                socket.emit('joinVoice');
            } catch (err) {
                alert("Mikrofon izni alınamadı!");
            }
        });

        muteVoiceBtn.addEventListener('click', () => {
            if (localStream) {
                isMuted = !isMuted;
                localStream.getAudioTracks()[0].enabled = !isMuted;
                muteVoiceBtn.innerText = isMuted ? "Sesi Aç" : "Sustur";
            }
        });

        leaveVoiceBtn.addEventListener('click', () => {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            if (speakingInterval) clearInterval(speakingInterval);
            if (audioContext) audioContext.close();

            for (let id in peers) {
                peers[id].close();
            }
            peers = {};
            audioContainer.innerHTML = '';
            
            joinVoiceBtn.style.display = 'block';
            leaveVoiceBtn.style.display = 'none';
            muteVoiceBtn.style.display = 'none';
            voiceStatus.style.display = 'none';

            stopTimer();
            socket.emit('leaveVoice');
        });

        socket.on('userJoinedVoice', async (id) => {
            const peer = createPeer(id);
            peers[id] = peer;
            localStream.getTracks().forEach(track => peer.addTrack(track, localStream));
            
            const offer = await peer.createOffer();
            await peer.setLocalDescription(offer);
            socket.emit('signal', { to: id, signal: offer });
        });

        socket.on('signal', async (data) => {
            if (data.signal.type === 'offer') {
                const peer = createPeer(data.from);
                peers[data.from] = peer;
                localStream.getTracks().forEach(track => peer.addTrack(track, localStream));
                
                await peer.setRemoteDescription(new RTCSessionDescription(data.signal));
                const answer = await peer.createAnswer();
                await peer.setLocalDescription(answer);
                socket.emit('signal', { to: data.from, signal: answer });
            } else if (data.signal.type === 'answer') {
                await peers[data.from].setRemoteDescription(new RTCSessionDescription(data.signal));
            } else if (data.signal.candidate) {
                await peers[data.from].addIceCandidate(new RTCIceCandidate(data.signal.candidate));
            }
        });

        socket.on('userLeftVoice', (id) => {
            if (peers[id]) {
                peers[id].close();
                delete peers[id];
                const audioElement = document.getElementById(`audio-${id}`);
                if (audioElement) audioElement.remove();
            }
        });

        function createPeer(id) {
            const peer = new RTCPeerConnection(rtcConfig);
            peer.onicecandidate = (e) => {
                if (e.candidate) {
                    socket.emit('signal', { to: id, signal: { candidate: e.candidate } });
                }
            };
            peer.ontrack = (e) => {
                let audio = document.getElementById(`audio-${id}`);
                if (!audio) {
                    audio = document.createElement('audio');
                    audio.id = `audio-${id}`;
                    audio.autoplay = true;
                    audioContainer.appendChild(audio);
                }
                audio.srcObject = e.streams[0];
            };
            return peer;
        }
    </script>
</body>
</html>
