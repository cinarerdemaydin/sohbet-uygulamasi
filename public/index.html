<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAFFLE</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

:root{
    --bg:#07090d;
    --panel:#0d1118;
    --line:rgba(255,255,255,.08);
    --muted:#7f8a9a;
    --accent:#7c5cff;
    --green:#20d6a2;
}

body{
    background:
        radial-gradient(
            circle at 20% 10%,
            rgba(124,92,255,.12),
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(32,214,162,.08),
            transparent 28%
        ),
        var(--bg);

    color:#e6e6e6;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}


/* =========================================================
   GİRİŞ
========================================================= */

#login-screen{
    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            rgba(18,23,33,.96),
            rgba(8,11,17,.98)
        );

    border:1px solid var(--line);

    box-shadow:
        0 30px 80px rgba(0,0,0,.45);

    padding:36px;

    border-radius:24px;

    width:100%;
    max-width:430px;

    text-align:center;
}

#login-screen::after{
    content:
        "Gerçek zamanlı sohbet • ses • ekran paylaşımı";

    display:block;

    color:#7f8a9a;

    font-size:12px;

    margin-top:18px;
}

.login-brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;

    margin-bottom:25px;
}

.login-brand h2{
    font-size:24px;
    color:#fff;
    font-weight:800;
    letter-spacing:2px;
}

.input-group{
    margin-bottom:15px;
    text-align:left;
}

.input-group label{
    display:block;

    font-size:11px;

    text-transform:uppercase;

    color:#7f8a9a;

    margin-bottom:7px;

    letter-spacing:.08em;
}

.custom-input,
.custom-select{
    width:100%;

    padding:13px 14px;

    background:
        rgba(4,7,11,.75);

    border:
        1px solid var(--line);

    border-radius:11px;

    color:#fff;

    outline:none;

    transition:.2s;
}

.custom-input:focus,
.custom-select:focus{
    border-color:
        rgba(124,92,255,.75);

    box-shadow:
        0 0 0 3px
        rgba(124,92,255,.12);
}

.btn-primary{
    width:100%;

    padding:13px;

    background:
        linear-gradient(
            135deg,
            #fff,
            #dfe5ef
        );

    color:#000;

    border:none;

    border-radius:11px;

    font-weight:700;

    cursor:pointer;

    margin-top:10px;

    transition:.2s;
}

.btn-primary:hover{
    transform:translateY(-1px);
    box-shadow:
        0 10px 30px
        rgba(255,255,255,.08);
}

.error-msg{
    color:#ef4444;

    font-size:12px;

    margin-top:10px;

    display:none;
}


/* =========================================================
   ANA KONTEYNER
========================================================= */

#chat-container{
    display:none;

    width:100%;
    height:100vh;

    overflow:hidden;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
    width:292px;

    padding:18px 14px 12px;

    background:
        linear-gradient(
            180deg,
            #0c1017,
            #090c12
        );

    border-right:
        1px solid var(--line);

    display:flex;

    flex-direction:column;

    user-select:none;

    position:relative;
}


/* LOGO */

.brand-header{
    display:flex;

    align-items:center;

    gap:10px;

    padding:
        4px 8px 16px;

    margin-bottom:12px;

    border-bottom:
        1px solid var(--line);
}

.brand-header svg{
    flex-shrink:0;
}

.brand-title{
    font-size:20px;

    font-weight:800;

    color:#fff;

    letter-spacing:2px;
}


/* ODA BAŞLIKLARI */

.room-tag{
    font-size:10px;

    color:#687486;

    text-transform:uppercase;

    margin:
        15px 8px 7px;

    font-weight:bold;

    letter-spacing:.12em;
}

.room-title{
    font-size:15px;

    font-weight:600;

    color:#fff;

    padding:10px 12px;

    background:
        linear-gradient(
            135deg,
            rgba(124,92,255,.17),
            rgba(124,92,255,.06)
        );

    border:
        1px solid
        rgba(124,92,255,.2);

    border-left:
        3px solid
        var(--accent);

    border-radius:11px;

    margin-bottom:8px;
}


/* ODA LİSTESİ */

.room-list{
    display:flex;

    flex-direction:column;

    gap:4px;

    margin-bottom:6px;
}

.room-item{
    padding:10px 11px;

    background:transparent;

    border:
        1px solid transparent;

    border-radius:10px;

    font-size:13px;

    color:#8f99a8;

    cursor:pointer;

    transition:.18s;

    display:flex;

    flex-direction:column;
}

.room-item:hover{
    background:
        rgba(255,255,255,.045);

    border-color:
        var(--line);

    color:#fff;

    transform:
        translateX(2px);
}

.room-item.active{
    background:
        rgba(124,92,255,.12);

    color:#fff;

    border-color:
        rgba(124,92,255,.24);

    font-weight:600;
}


/* SES ODALARI */

.voice-room.active-voice{
    background:
        rgba(32,214,162,.09);

    border-color:
        rgba(32,214,162,.25);
}

.voice-room-header{
    display:flex;

    align-items:center;

    justify-content:space-between;

    width:100%;
}

.voice-room-timer{
    font-family:monospace;

    font-size:11px;

    color:#20d6a2;

    background:
        rgba(32,214,162,.15);

    padding:2px 6px;

    border-radius:4px;

    font-weight:600;
}

.voice-room-users{
    margin-top:4px;

    padding-left:10px;

    display:flex;

    flex-direction:column;

    gap:3px;
}

.voice-user-tag{
    font-size:11px;

    color:#20d6a2;

    display:flex;

    align-items:center;

    gap:6px;
}

.voice-user-tag::before{
    content:"•";

    color:#20d6a2;

    font-size:14px;
}


/* ÇEVRİMİÇİ */

.online-list{
    flex:1;

    overflow-y:auto;

    margin-bottom:80px;
}

.user-item{
    display:flex;

    align-items:center;

    gap:10px;

    font-size:13px;

    font-weight:600;

    padding:8px 9px;

    border-radius:8px;

    transition:.2s;

    cursor:context-menu;

    border:
        1px solid transparent;
}

.user-item:hover{
    background:
        rgba(255,255,255,.04);

    border-color:
        var(--line);
}

.status-dot{
    width:8px;

    height:8px;

    background:#444;

    border-radius:50%;

    transition:.2s;
}

.user-item.speaking{
    background:
        rgba(32,214,162,.08);

    border-color:
        rgba(32,214,162,.25);
}

.user-item.speaking .status-dot{
    background:#20d6a2;

    box-shadow:
        0 0 8px
        #20d6a2;
}


/* =========================================================
   ALT KONTROL PANELİ
========================================================= */

.user-control-panel{
    position:absolute;

    bottom:0;

    left:0;

    width:100%;

    background:
        rgba(14,18,26,.96);

    border-top:
        1px solid var(--line);

    padding:10px;

    backdrop-filter:
        blur(16px);
}

.panel-footer{
    display:flex;

    align-items:center;

    justify-content:space-between;
}

.user-badge{
    display:flex;

    align-items:center;

    gap:8px;

    overflow:hidden;
}

.user-badge .avatar{
    width:30px;

    height:30px;

    background:#262626;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:12px;

    font-weight:bold;

    color:#fff;

    flex-shrink:0;
}

.username-text{
    font-size:13px;

    font-weight:600;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    max-width:90px;
}

.icon-actions{
    display:flex;

    align-items:center;

    gap:4px;
}

.icon-btn{
    background:transparent;

    border:
        1px solid transparent;

    color:#b9bbbe;

    width:32px;

    height:32px;

    border-radius:9px;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    font-size:13px;

    transition:.15s;
}

.icon-btn:hover{
    background:
        rgba(255,255,255,.07);

    border-color:
        var(--line);

    color:#fff;
}

.icon-btn.active-danger{
    color:#ef4444;
}

.icon-btn.active-danger:hover{
    background:
        rgba(239,68,68,.15);
}

.icon-btn.btn-disconnect{
    color:#ef4444;

    display:none;
}


/* =========================================================
   CHAT
========================================================= */

.chat-main{
    flex:1;

    display:flex;

    flex-direction:column;

    background:
        linear-gradient(
            180deg,
            #0b0f15,
            #080b10
        );

    position:relative;
}


/* ÜST CHAT BAR */

.chat-header{
    min-height:70px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 22px;

    border-bottom:
        1px solid var(--line);

    background:
        rgba(10,14,20,.84);

    backdrop-filter:
        blur(18px);

    z-index:3;
}

.room-heading{
    display:flex;

    align-items:center;

    gap:12px;
}

.room-heading-icon{
    width:38px;

    height:38px;

    border-radius:12px;

    display:grid;

    place-items:center;

    background:
        rgba(124,92,255,.14);

    color:#b8aaff;

    border:
        1px solid
        rgba(124,92,255,.2);
}

.room-heading h1{
    font-size:16px;
}

.room-heading p{
    color:#6f7b8d;

    font-size:11px;

    margin-top:4px;
}

.header-tools{
    display:flex;

    align-items:center;

    gap:8px;
}

.audio-status{
    display:flex;

    align-items:center;

    gap:7px;

    color:#7f8a9a;

    font-size:10px;

    padding:3px 8px;
}

.audio-status i{
    color:var(--green);
}

.status-pill{
    display:flex;

    align-items:center;

    gap:7px;

    border:
        1px solid var(--line);

    background:
        rgba(255,255,255,.035);

    color:#9ba5b5;

    padding:7px 10px;

    border-radius:999px;

    font-size:11px;
}

.status-pill .dot{
    width:7px;

    height:7px;

    border-radius:50%;

    background:#f0b429;
}

.status-pill.online .dot{
    background:var(--green);

    box-shadow:
        0 0 8px
        rgba(32,214,162,.6);
}


/* =========================================================
   EKRAN PAYLAŞIMI
========================================================= */

#video-grid{
    display:none;

    padding:16px;

    background:#000;

    gap:12px;

    flex-wrap:wrap;

    justify-content:center;

    align-items:center;

    max-height:60vh;

    overflow-y:auto;

    border-bottom:
        1px solid #222;
}

.video-box{
    position:relative;

    width:100%;

    max-width:800px;

    background:#111;

    border-radius:8px;

    overflow:hidden;

    border:
        1px solid #333;

    display:flex;

    flex-direction:column;
}

.video-box video{
    width:100%;

    height:auto;

    max-height:50vh;

    display:block;

    background:#000;

    object-fit:contain;
}

.video-controls{
    display:flex;

    align-items:center;

    justify-content:space-between;

    background:
        rgba(15,15,15,.95);

    padding:8px 12px;

    border-top:
        1px solid #222;
}

.video-label{
    font-size:12px;

    color:#fff;

    font-weight:600;
}

.video-actions{
    display:flex;

    align-items:center;

    gap:12px;
}

.video-vol-wrapper{
    display:flex;

    align-items:center;

    gap:6px;

    font-size:11px;

    color:#aaa;
}

.video-vol-wrapper input{
    width:70px;
}

.btn-fullscreen{
    background:#222;

    color:#fff;

    border:
        1px solid #444;

    padding:4px 8px;

    border-radius:4px;

    font-size:11px;

    cursor:pointer;
}


/* =========================================================
   MESAJLAR
========================================================= */

.messages-area{
    flex:1;

    padding:
        24px
        clamp(18px,4vw,52px);

    overflow-y:auto;

    display:flex;

    flex-direction:column;

    gap:5px;
}

.msg{
    max-width:
        min(760px,78%);

    background:transparent;

    border:0;

    padding:10px 13px;

    border-radius:12px;

    align-self:flex-start;
}

.msg:hover{
    background:
        rgba(255,255,255,.035);
}

.msg.me{
    align-self:flex-start;

    background:
        rgba(124,92,255,.065);

    border:
        1px solid
        rgba(124,92,255,.08);
}

.msg-meta{
    display:flex;

    justify-content:space-between;

    gap:12px;

    margin-bottom:4px;

    font-size:11px;
}

.msg-user{
    font-weight:600;
}

.msg-time{
    color:#596475;

    font-size:10px;
}

.msg-text{
    font-size:14px;

    color:#dddddd;

    word-break:break-word;

    line-height:1.55;
}

.typing-indicator{
    height:18px;

    font-size:11px;

    color:#888;

    padding:
        0
        clamp(18px,4vw,52px);

    font-style:italic;
}


/* =========================================================
   MESAJ GİRİŞİ
========================================================= */

.input-bar{
    padding:
        12px
        clamp(18px,4vw,52px)
        20px;

    background:
        linear-gradient(
            180deg,
            transparent,
            #080b10 30%
        );
}

.input-wrapper{
    display:flex;

    gap:12px;

    background:#111720;

    border:
        1px solid var(--line);

    padding:
        6px
        6px
        6px
        15px;

    border-radius:14px;

    box-shadow:
        0 12px 35px
        rgba(0,0,0,.18);
}

.input-wrapper:focus-within{
    border-color:
        rgba(124,92,255,.42);

    box-shadow:
        0 0 0 3px
        rgba(124,92,255,.08);
}

.chat-input{
    flex:1;

    background:transparent;

    border:none;

    outline:none;

    color:#fff;

    font-size:14px;
}

.send-btn{
    background:
        linear-gradient(
            135deg,
            #8a6cff,
            #6747ed
        );

    color:#fff;

    border:none;

    padding:
        10px 17px;

    border-radius:10px;

    font-weight:600;

    cursor:pointer;
}


/* =========================================================
   SAĞ TIK MENÜ
========================================================= */

#context-menu{
    display:none;

    position:absolute;

    background:#181818;

    border:
        1px solid #333;

    border-radius:8px;

    padding:12px;

    width:180px;

    box-shadow:
        0 4px 12px
        rgba(0,0,0,.5);

    z-index:1000;
}

#context-menu h4{
    font-size:12px;

    color:#fff;

    margin-bottom:8px;

    border-bottom:
        1px solid #282828;

    padding-bottom:4px;
}

#context-menu label{
    font-size:11px;

    color:#aaa;

    display:block;

    margin-bottom:4px;
}

#context-menu input[type=range]{
    width:100%;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:820px){

    .sidebar{
        width:235px;
    }

    .header-tools .audio-status{
        display:none;
    }

    .msg{
        max-width:92%;
    }
}

@media(max-width:620px){

    .sidebar{
        width:72px;

        padding:12px 8px;
    }

    .brand-title,
    .room-tag,
    .room-title,
    .online-list{
        display:none;
    }

    .brand-header{
        justify-content:center;
    }

    .room-item{
        width:48px;

        min-height:44px;

        justify-content:center;
    }

    .voice-room-header{
        justify-content:center;
    }

    .chat-header{
        padding:0 12px;
    }

    .messages-area{
        padding:16px 10px;
    }

    .input-bar{
        padding:8px 10px 12px;
    }
}

</style>
</head>

<body>


<!-- =====================================================
     GİRİŞ EKRANI
===================================================== -->

<div id="login-screen">

    <div class="login-brand">

        <svg
            width="28"
            height="28"
            viewBox="0 0 100 100"
            fill="none"
            xmlns="http://www.w3.org/2000/svg">

            <circle
                cx="50"
                cy="50"
                r="42"
                stroke="#ffffff"
                stroke-width="8"/>

            <path
                d="M22 50H78 M50 22V78 M32 25V75 M68 25V75 M25 32H75 M25 68H75"
                stroke="#ffffff"
                stroke-width="6"/>

        </svg>

        <h2>WAFFLE</h2>

    </div>


    <div class="input-group">

        <label>
            Kullanıcı Adı
        </label>

        <input
            type="text"
            id="username-input"
            class="custom-input"
            placeholder="İsminiz..."
            autocomplete="off">

    </div>


    <div class="input-group">

        <label>
            İsim Rengi
        </label>

        <select
            id="color-input"
            class="custom-select">

            <option value="#3b82f6">
                Mavi
            </option>

            <option value="#10b981">
                Yeşil
            </option>

            <option value="#ef4444">
                Kırmızı
            </option>

            <option value="#ec4899">
                Pembe
            </option>

            <option value="#a855f7">
                Eflatun / Mor
            </option>

            <option value="#f97316">
                Turuncu
            </option>

            <option value="#eab308">
                Sarı
            </option>

            <option value="#06b6d4">
                Çyan / Turkuaz
            </option>

        </select>

    </div>


    <div class="input-group">

        <label>
            Oda Şifresi
        </label>

        <input
            type="password"
            id="password-input"
            class="custom-input"
            placeholder="Oda şifresi..."
            autocomplete="off">

    </div>


    <button
        id="join-btn"
        class="btn-primary">

        Giriş Yap

    </button>


    <div
        id="error-box"
        class="error-msg">

        Hatalı Şifre!

    </div>

</div>



<!-- =====================================================
     ANA UYGULAMA
===================================================== -->

<div id="chat-container">


    <!-- SIDEBAR -->

    <div class="sidebar">


        <div class="brand-header">

            <svg
                width="26"
                height="26"
                viewBox="0 0 100 100"
                fill="none"
                xmlns="http://www.w3.org/2000/svg">

                <circle
                    cx="50"
                    cy="50"
                    r="42"
                    stroke="#ffffff"
                    stroke-width="8"/>

                <path
                    d="M22 50H78 M50 22V78 M32 25V75 M68 25V75 M25 32H75 M25 68H75"
                    stroke="#ffffff"
                    stroke-width="6"/>

            </svg>

            <span class="brand-title">
                WAFFLE
            </span>

        </div>


        <div class="room-tag">
            Aktif Oda
        </div>


        <div
            id="active-room-title"
            class="room-title">

            # Genel

        </div>


        <div class="room-tag">
            Metin Odaları
        </div>


        <div class="room-list">

            <div
                class="room-item text-room active"
                onclick="switchRoom('Genel')">

                # Genel

            </div>


            <div
                class="room-item text-room"
                onclick="switchRoom('Oyun')">

                # Oyun

            </div>


            <div
                class="room-item text-room"
                onclick="switchRoom('Müzik')">

                # Müzik

            </div>

        </div>


        <div class="room-tag">
            Sesli Odalar
        </div>


        <div class="room-list">


            <div
                class="room-item voice-room"
                onclick="joinVoiceChannel('Sesli - Genel')">

                <div class="voice-room-header">

                    <span>
                        🔊 Sesli - Genel
                    </span>

                    <span
                        id="vtimer-Sesli - Genel"
                        class="voice-room-timer"
                        style="display:none">

                        00:00

                    </span>

                </div>


                <div
                    id="vusers-Sesli - Genel"
                    class="voice-room-users">
                </div>

            </div>


            <div
                class="room-item voice-room"
                onclick="joinVoiceChannel('Sesli - Oyun')">

                <div class="voice-room-header">

                    <span>
                        🔊 Sesli - Oyun
                    </span>

                    <span
                        id="vtimer-Sesli - Oyun"
                        class="voice-room-timer"
                        style="display:none">

                        00:00

                    </span>

                </div>


                <div
                    id="vusers-Sesli - Oyun"
                    class="voice-room-users">
                </div>

            </div>

        </div>


        <div class="room-tag">
            Çevrim İçi
        </div>


        <div
            class="online-list"
            id="user-list">
        </div>


        <div class="user-control-panel">

            <div class="panel-footer">


                <div class="user-badge">

                    <div
                        id="user-avatar"
                        class="avatar">

                        U

                    </div>


                    <span
                        id="panel-username"

function escapeHTML(str) {

    return String(str).replace(
        /[&<>"']/g,
        function(m) {

            return {

                '&':'&amp;',

                '<':'&lt;',

                '>':'&gt;',

                '"':'&quot;',

                "'":'&#039;'

            }[m];

        }
    );
}


/* =========================================================
   BİLDİRİM SESİ
========================================================= */

function playBeep(
    freq = 440,
    type = 'sine',
    duration = 0.1
) {

    try {

        const ctx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        const osc =
            ctx.createOscillator();

        const gain =
            ctx.createGain();


        osc.type = type;

        osc.frequency.value =
            freq;


        gain.gain.setValueAtTime(
            0.1,
            ctx.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            ctx.currentTime + duration
        );


        osc.connect(gain);

        gain.connect(
            ctx.destination
        );


        osc.start();

        osc.stop(
            ctx.currentTime + duration
        );

    } catch(e) {}

}

function startTimer(

/* =========================================================
   MİKROFON / KONUŞMA ANALİZİ
========================================================= */

function setupAudioAnalysis(
    stream
) {

    try {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        analyser =
            audioContext.createAnalyser();


        microphone =
            audioContext.createMediaStreamSource(
                stream
            );


        microphone.connect(
            analyser
        );


        analyser.fftSize =
            256;


        const bufferLength =
            analyser.frequencyBinCount;


        const dataArray =
            new Uint8Array(
                bufferLength
            );


        let wasSpeaking =
            false;


        speakingInterval =
            setInterval(
                () => {

                    if (
                        isMuted
                    ) {

                        if (
                            wasSpeaking
                        ) {

                            wasSpeaking =
                                false;


                            socket.emit(
                                'speakingStatus',
                                false
                            );

                        }

                        return;

                    }


                    analyser.getByteFrequencyData(
                        dataArray
                    );


                    let sum =
                        0;


                    for (
                        let i = 0;
                        i < bufferLength;
                        i++
                    ) {

                        sum +=
                            dataArray[i];

                    }


                    const average =
                        sum /
                        bufferLength;


                    const isSpeaking =
                        average >
                        12;


                    if (
                        isSpeaking !==
                        wasSpeaking
                    ) {

                        wasSpeaking =
                            isSpeaking;


                        socket.emit(
                            'speakingStatus',
                            isSpeaking
                        );

                    }

                },
                100
            );

    } catch(e) {}

}

/* =========================================================

async function joinVoiceChannel(
    channelName
) {

    if (
        currentVoiceChannel ===
        channelName
    ) {
        return;
    }


    if (
        currentVoiceChannel
    ) {

        leaveVoiceChannel(
            false
        );

    }


    try {

        if (!localStream) {

            localStream =
                await navigator.mediaDevices
                    .getUserMedia({

                        audio: {

                            echoCancellation:true,

                            noiseSuppression:true,

                            autoGainControl:true

                        },

                        video:false

                    });


            setupAudioAnalysis(
                localStream
            );

        }


        currentVoiceChannel =
            channelName;


        document
            .querySelectorAll(
                '.voice-room'
            )
            .forEach(
                el =>
                    el.classList.remove(
                        'active-voice'
                    )
            );


        document
            .querySelectorAll(
                '.voice-room'
            )
            .forEach(
                el => {

                    if (
                        el.innerText.includes(
                            channelName.replace(
                                'Sesli - ',
                                ''
                            )
                        )
                    ) {

                        el.classList.add(
                            'active-voice'
                        );

                    }

                }
            );


        leaveVoiceBtn.style.display =
            'flex';


        playBeep(
            880,
            'triangle',
            0.15
        );


        startTimer(
            channelName
        );


        socket.emit(
            'joinVoiceChannel',
            channelName
        );

    } catch(err) {

        alert(
            "Mikrofon izni verilmedi veya erişilemedi."
        );

    }

}


/* =========================================================
   SES KANALINDAN ÇIK
========================================================= */

function leaveVoiceChannel(
    resetMedia = true
) {

    stopScreenShare();


    if (
        resetMedia &&
        localStream
    ) {

        localStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );


        localStream =
            null;


        if (
            speakingInterval
        ) {

            clearInterval(
                speakingInterval
            );

        }


        if (
            audioContext
        ) {

            audioContext.close();

        }

    }


    for (
        let id in peers
    ) {

        peers[id].close();

    }


    peers = {};

    screenSenders = {};

    audioContainer.innerHTML =
        '';

    videoGrid.innerHTML =
        '';

    videoGrid.style.display =
        'none';


    leaveVoiceBtn.style.display =
        'none';


    stopTimer();


    document
        .querySelectorAll(
            '.voice-room'
        )
        .forEach(
            el =>
                el.classList.remove(
                    'active-voice'
                )
        );


    if (
        currentVoiceChannel
    ) {

        socket.emit(
            'leaveVoiceChannel',
            currentVoiceChannel
        );

        currentVoiceChannel =
            null;

    }


    if (resetMedia) {

        playBeep(
            330,
            'triangle',
            0.2
        );

    }

}


leaveVoiceBtn.addEventListener(

screenShareBtn.addEventListener(
    'click',
    async () => {

        if (!screenStream) {

            try {

                screenStream =
                    await navigator.mediaDevices
                        .getDisplayMedia({

                            video: {

                                cursor:"always",

                                width:{
                                    max:1920,
                                    ideal:1280
                                },

                                height:{
                                    max:1080,
                                    ideal:720
                                },

                                frameRate:{
                                    max:30,
                                    ideal:30
                                }

                            },

                            audio:true

                        });


                const videoTrack =
                    screenStream
                        .getVideoTracks()[0];


                if (
                    videoTrack.contentHint !==
                    undefined
                ) {

                    videoTrack.contentHint =
                        'motion';

                }


                screenShareBtn.classList.add(
                    'active-danger'
                );


                addVideoBox(
                    'my-screen',
                    screenStream,
                    `${currentUser} (Ekranınız)`
                );


                for (
                    let id in peers
                ) {

                    screenStream
                        .getTracks()
                        .forEach(
                            track => {

                                const sender =
                                    peers[id]
                                        .addTrack(
                                            track,
                                            screenStream
                                        );


                                screenSenders[id] =
                                    sender;

                            }
                        );


                    const offer =
                        await peers[id]
                            .createOffer();


                    await peers[id]
                        .setLocalDescription(
                            offer
                        );


                    socket.emit(
                        'signal',
                        {
                            to:id,
                            signal:offer
                        }
                    );

                }


                socket.emit(
                    'screenShareStarted'
                );


                videoTrack.onended =
                    () => {

                        stopScreenShare();

                    };


            } catch(e) {

                console.log(
                    "Ekran paylaşımı iptal edildi:",
                    e
                );

            }

        } else {

            stopScreenShare();

        }

    }
);


/* =========================================================
   EKRAN PAYLAŞIMINI DURDUR
========================================================= */

async function stopScreenShare() {

    if (screenStream) {

        screenStream
            .getTracks()
            .forEach(
                t =>
                    t.stop()
            );


        screenStream =
            null;

    }


    for (
        let id in peers
    ) {

        if (
            screenSenders[id]
        ) {

            try {

                peers[id]
                    .removeTrack(
                        screenSenders[id]
                    );

            } catch(e) {}


            delete screenSenders[id];


            try {

                const offer =
                    await peers[id]
                        .createOffer();


                await peers[id]
                    .setLocalDescription(
                        offer
                    );


                socket.emit(
                    'signal',
                    {
                        to:id,
                        signal:offer
                    }
                );

            } catch(e) {}

        }

    }


    screenShareBtn.classList.remove(
        'active-danger'
    );


    const myBox =
        document.getElementById(
            'video-box-my-screen'
        );


    if (myBox) {
        myBox.remove();
    }


    checkVideoGrid();


    socket.emit(
        'screenShareStopped'
    );

}


socket.on(
    'userStoppedScreenShare',
    id => {

        const videoBox =
            document.getElementById(
                `video-box-${id}`
            );


        if (videoBox) {

            videoBox.remove();

        }


        checkVideoGrid();

    }
);


/* =========================================================
   MİKROFON SUSTUR
========================================================= */

muteVoiceBtn.addEventListener(
    'click',
    () => {

        if (!localStream) {
            return;
        }


        isMuted =
            !isMuted;


        localStream
            .getAudioTracks()[0]
            .enabled =
                !isMuted;


        if (isMuted) {

            muteVoiceBtn.innerHTML =
                `<i class="fa-solid fa-microphone-slash"></i>`;

            muteVoiceBtn.classList.add(
                'active-danger'
            );

        } else {

            muteVoiceBtn.innerHTML =
                `<i class="fa-solid fa-microphone"></i>`;

            muteVoiceBtn.classList.remove(
                'active-danger'
            );

        }

    }
);


/* =========================================================
   KULAKLIK
========================================================= */

deafenVoiceBtn.addEventListener(
    'click',
    () => {

        isDeafened =
            !isDeafened;


        if (isDeafened) {

            deafenVoiceBtn.innerHTML =
                `<i class="fa-solid fa-ear-deaf"></i>`;

            deafenVoiceBtn.classList.add(
                'active-danger'
            );

        } else {

            deafenVoiceBtn.innerHTML =
                `<i class="fa-solid fa-headphones"></i>`;

            deafenVoiceBtn.classList.remove(
                'active-danger'
            );

        }


        const audioElements =
            audioContainer
                .querySelectorAll(
                    'audio'
                );


        audioElements.forEach(
            audio => {

                audio.muted =
                    isDeafened;

            }
        );


        const videoElements =
            videoGrid
                .querySelectorAll(
                    'video'
                );


        videoElements.forEach(
            video => {

                if (
                    video.parentElement.id !==
                    'video-box-my-screen'
                ) {

                    video.muted =
                        isDeafened;

                }

            }
        );

    }
);


/* =========================================================
   YENİ SES KULLANICISI
========================================================= */

socket.on(
    'userJoinedVoice',
    async id => {

        const peer =
            createPeer(id);


        peers[id] =
            peer;


        if (localStream) {

            localStream
                .getTracks()
                .forEach(
                    track =>
                        peer.addTrack(
                            track,
                            localStream
                        )
                );

        }


        if (screenStream) {

            screenStream
                .getTracks()
                .forEach(
                    track => {

                        const sender =
                            peer.addTrack(
                                track,
                                screenStream
                            );


                        screenSenders[id] =
                            sender;

                    }
                );

        }


        const offer =
            await peer.createOffer();


        await peer.setLocalDescription(
            offer
        );


        socket.emit(
            'signal',
            {
                to:id,
                signal:offer
            }
        );

    }
);


/* =========================================================
   WEBRTC
========================================================= */

socket.on(
    'signal',
    async data => {

        if (
            data.signal.type ===
            'offer'
        ) {

            let peer =
                peers[data.from];


            if (!peer) {

                peer =
                    createPeer(
                        data.from
                    );


                peers[data.from] =
                    peer;


                if (localStream) {

                    localStream
                        .getTracks()
                        .forEach(
                            track =>
                                peer.addTrack(
                                    track,
                                    localStream
                                )
                        );

                }

            }


            await peer.setRemoteDescription(
                new RTCSessionDescription(
                    data.signal
                )
            );


            const answer =
                await peer.createAnswer();


            await peer.setLocalDescription(
                answer
            );


            socket.emit(
                'signal',
                {
                    to:data.from,
                    signal:answer
                }
            );

        }

        else if (
            data.signal.type ===
            'answer'
        ) {

            if (
                peers[data.from]
            ) {

                await peers[data.from]
                    .setRemoteDescription(
                        new RTCSessionDescription(
                            data.signal
                        )
                    );

            }

        }

        else if (
            data.signal.candidate
        ) {

            if (
                peers[data.from]
            ) {

                await peers[data.from]
                    .addIceCandidate(
                        new RTCIceCandidate(
                            data.signal.candidate
                        )
                    )
                    .catch(
                        () => {}
                    );

            }

        }

    }
);


/* =========================================================
   SES KULLANICISI AYRILDI
========================================================= */

socket.on(
    'userLeftVoice',
    id => {

        if (
            peers[id]
        ) {

            peers[id].close();

            delete peers[id];

            delete screenSenders[id];


            const audioElement =
                document.getElementById(
                    `audio-${id}`
                );


            if (audioElement) {

                audioElement.remove();

            }


            const videoBox =
                document.getElementById(
                    `video-box-${id}`
                );


            if (videoBox) {

                videoBox.remove();

            }


            checkVideoGrid();

        }

    }
);


/* =========================================================
   PEER OLUŞTUR
========================================================= */

function createPeer(id) {

    const peer =
        new RTCPeerConnection(
            rtcConfig
        );


    peer.onicecandidate =
        e => {

            if (
                e.candidate
            ) {

                socket.emit(
                    'signal',
                    {
                        to:id,

                        signal:{
                            candidate:
                                e.candidate
                        }
                    }
                );

            }

        };


    peer.ontrack =
        e => {

            if (
                e.track.kind ===
                'audio'
            ) {

                let audio =
                    document.getElementById(
                        `audio-${id}`
                    );


                if (!audio) {

                    audio =
                        document.createElement(
                            'audio'
                        );


                    audio.id =
                        `audio-${id}`;


                    audio.autoplay =
                        true;


                    audio.playsInline =
                        true;


                    audio.muted =
                        isDeafened;


                    audioContainer.appendChild(
                        audio
                    );

                }


                audio.srcObject =
                    e.streams[0];


                audio.play()
                    .catch(
                        err =>
                            console.log(err)
                    );

            }

            else if (
                e.track.kind ===
                'video'
            ) {

                addVideoBox(
                    id,
                    e.streams[0],
                    "Yayın Ekranı"
                );

            }

        };


    return peer;

}


/* =========================================================
   VİDEO KUTUSU
========================================================= */

function addVideoBox(
    id,
    stream,
    labelText
) {

    let box =
        document.getElementById(
            `video-box-${id}`
        );


    if (!box) {

        box =
            document.createElement(
                'div'
            );


        box.id =
            `video-box-${id}`;


        box.classList.add(
            'video-box'
        );


        box.innerHTML = `

            <video
                autoplay
                playsinline>
            </video>

            <div class="video-controls">

                <div class="video-label">

                    ${labelText}

                </div>

                <div class="video-actions">

                    <div class="video-vol-wrapper">

                        <span>
                            Ses:
                        </span>

                        <input
                            type="range"
                            class="stream-vol-slider"
                            min="0"
                            max="100"
                            value="100">

                    </div>

                    <button
                        class="btn-fullscreen">

                        Tam Ekran

                    </button>

                </div>

            </div>

        `;


        videoGrid.appendChild(
            box
        );


        const videoElem =
            box.querySelector(
                'video'
            );


        const volInput =
            box.querySelector(
                '.stream-vol-slider'
            );


        const fsBtn =
            box.querySelector(
                '.btn-fullscreen'
            );


        if (
            id === 'my-screen'
        ) {

            videoElem.muted =
                true;

            volInput.disabled =
                true;

        } else {

            videoElem.muted =
                isDeafened;

        }


        volInput.addEventListener(
            'input',
            e => {

                videoElem.volume =
                    e.target.value /
                    100;

            }
        );


        fsBtn.addEventListener(
            'click',
            () => {

                if (
                    videoElem.requestFullscreen
                ) {

                    videoElem.requestFullscreen();

                }

                else if (
                    videoElem.webkitRequestFullscreen
                ) {

                    videoElem.webkitRequestFullscreen();

                }

            }
        );

    }


    const videoElem =
        box.querySelector(
            'video'
        );


    videoElem.srcObject =
        stream;


    videoElem.play()
        .catch(
            e =>
                console.log(e)
        );


    videoGrid.style.display =
        'flex';

}


/* =========================================================
   VİDEO ALANI KONTROL
========================================================= */

function checkVideoGrid() {

    if (
        videoGrid.children.length ===
        0
    ) {

        videoGrid.style.display =
            'none';

    }

}

</script>
